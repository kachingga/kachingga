# Smoke E2E: abre la app desde cero y verifica que arranca.
# Cómo correrlo y requisitos: apps/mobile/CLAUDE.md → "Testing" → "E2E (Maestro)".
appId: com.kachingga.app
---
- launchApp:
    clearState: true
# El primer arranque en un emulador de CI puede tardar
- extendedWaitUntil:
    visible: 'Kachingga'
    timeout: 60000
