<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f6ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101a16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kachingga" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Kachingga</title>
    <!-- Theme before the first paint (no flash). Same logic and key as src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('kachingga-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
