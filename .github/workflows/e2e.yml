name: E2E (Android)

# Flujos de Maestro (apps/mobile/.maestro) contra un build release real en un emulador Android.
# No es check obligatorio (tarda ~15-20 min y los emuladores pueden ser flaky):
# corre a mano (Actions → "E2E (Android)" → Run workflow) o en PRs con la label `e2e`.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro en emulador Android
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Por defecto solo main guarda caché; así cada PR también reaprovecha sus corridas anteriores
          cache-read-only: false
      # Caché del C++ de React Native y módulos nativos (lo más pesado de compilar)
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: e2e-android-${{ hashFiles('bun.lock') }}
          restore-keys: e2e-android-
          max-size: 2G
      - run: bun install --frozen-lockfile

      # android/ se genera (Continuous Native Generation) y está gitignoreado
      - name: Prebuild Android
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      # Release = bundle JS embebido, no necesita Metro. Solo x86_64 (la arquitectura del emulador).
      - name: Build APK release
        working-directory: apps/mobile/android
        env:
          # 10.0.2.2 = la máquina host vista desde el emulador (para cuando los flujos usen la API)
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
          # CMake usa ccache para compilar C/C++ (ver paso de ccache)
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Los directorios de build nativos cambian entre corridas: que no entren en la clave de ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
        run: |
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64
          ccache --show-stats

      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Habilitar KVM (aceleración del emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr flujos en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Cada línea corre por separado: usar rutas desde la raíz del repo
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro --format junit --output maestro-report.xml

      - name: Guardar reporte y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore
