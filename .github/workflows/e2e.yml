name: E2E

# E2E de la web (Playwright, apps/web/e2e).
# No son checks obligatorios: corren a mano (Actions → "E2E" → Run workflow) o en PRs con la label `e2e`.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Playwright (web)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Instalar navegadores
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit
      # The critical flows (e2e/recorridos.spec.ts) need the API + the dev database and Supabase: they
      # run only if the E2E_* secrets exist (INFRA.md → "GitHub"). Without them only the specs that
      # don't need the API run (smoke, pwa, offline).
      - name: ¿Hay secrets para los recorridos con API?
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: |
          if [ -n "$E2E_DATABASE_URL" ]; then
            echo "E2E_API=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin los secrets E2E_*: no corren los recorridos con API (docs/claude/web/testing.md)."
          fi
      # Celular (WebKit, como Safari en iPhone) y compu (Chrome). With E2E_API=1 Playwright also starts
      # the API on :3000 and `preview` forwards /trpc to it (VITE_API_URL empty).
      - name: Correr Playwright
        working-directory: apps/web
        env:
          VITE_API_URL: ''
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci' }}
          # Cloudflare Turnstile's test site key: public, always passes (token XXXX.DUMMY.TOKEN.XXXX).
          # The captcha widget shows up as in prod, and the dev Supabase has the matching test secret
          # (INFRA.md → "Supabase"); with the captcha off there, the token is ignored.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          # For the API, and for apps/web/e2e/accounts.ts (the flows' accounts, already confirmed, made
          # with Supabase's admin API).
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
        run: bun run e2e
      # Artifacts of a public repo can be downloaded by anyone signed in to GitHub: kept for a short
      # time, and with E2E_API=1 without traces (playwright.config.ts), which would carry session tokens.
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 3
          if-no-files-found: ignore

