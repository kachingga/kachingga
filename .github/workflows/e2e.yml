name: E2E

# E2E de la web (Playwright, apps/web/e2e) y de la app nativa (Maestro, apps/mobile/.maestro).
# No son checks obligatorios: corren a mano (Actions → "E2E" → Run workflow) o en PRs con la label `e2e`.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Playwright (web)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Instalar navegadores
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit
      # Celular (WebKit, como Safari en iPhone) y compu (Chrome). La API no se levanta: el smoke no la necesita.
      - name: Correr Playwright
        working-directory: apps/web
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: bun run e2e
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  e2e:
    name: Maestro en emulador Android
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Por defecto solo main guarda caché; así cada PR también reaprovecha sus corridas anteriores
          cache-read-only: false
      - run: bun install --frozen-lockfile

      # android/ se genera (Continuous Native Generation) y está gitignoreado
      - name: Prebuild Android
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install

      # Release = bundle JS embebido, no necesita Metro. Solo x86_64 (la arquitectura del emulador).
      - name: Build APK release
        working-directory: apps/mobile/android
        env:
          # 10.0.2.2 = la máquina host vista desde el emulador (para cuando los flujos usen la API)
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
        # --build-cache reutiliza tareas de Gradle de corridas anteriores (bajó la compilación de ~15 a ~6 min).
        # Se probó ccache para el C++ y no aportaba (~3% de aciertos): no agregarlo de nuevo sin medir.
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64

      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Habilitar KVM (aceleración del emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr flujos en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Cada línea corre por separado: usar rutas desde la raíz del repo
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro --format junit --output maestro-report.xml

      - name: Guardar reporte y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore
