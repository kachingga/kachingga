name: E2E

# E2E de la web (Playwright, apps/web/e2e). Los flujos de Maestro de la app nativa (apps/mobile/.maestro) solo se corren en local.
# No son checks obligatorios: corren a mano (Actions → "E2E" → Run workflow) o en PRs con la label `e2e`.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Playwright (web)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Instalar navegadores
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium webkit
      # Celular (WebKit, como Safari en iPhone) y compu (Chrome). La API no se levanta: el smoke no la necesita.
      - name: Correr Playwright
        working-directory: apps/web
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: bun run e2e
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

