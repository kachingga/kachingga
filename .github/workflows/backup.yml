# Daily backup of the production database (schemas public + auth), encrypted.
# The repo is public and anyone signed in to GitHub can download artifacts, so the dump is
# streamed straight into gpg: nothing unencrypted is ever written, even on the runner.
# The secrets live in the `backup` environment (only `main` can use it), not in the repo secrets.
# It also checks the database size (alert before Supabase Free's limit). Restore steps: DEPLOY.md →
# "Backups"; the size alert: DEPLOY.md → "Monitoreo".
name: Backup diario de prod

on:
  schedule:
    - cron: '0 6 * * *' # Every day 06:00 UTC (03:00 in Argentina)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    steps:
      - name: Check secrets
        id: secrets
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secrets BACKUP_DATABASE_URL y/o BACKUP_PASSPHRASE en el environment 'backup' (DEPLOY.md → Backups)."
            exit 1
          fi

      - name: Dump and encrypt
        id: dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          name="kachingga-prod-$(date -u +%Y-%m-%d)"
          mkdir -p out
          # pg_dump 17 can dump older servers. The URL goes in as an env var, never as an argument.
          # Image pinned by digest (postgres:17.11); how to update it: DEPLOY.md → "Backups".
          # Live session data is left out (structure only): it's useless after a restore and
          # whoever got it could take over a session. mfa_amr_claims references sessions;
          # flow_state holds Google's tokens while logging in.
          docker run --rm -e BACKUP_DATABASE_URL \
            postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f \
            sh -c 'pg_dump "$BACKUP_DATABASE_URL" -Fc --schema=public --schema=auth --no-owner --no-privileges \
              --exclude-table-data=auth.refresh_tokens --exclude-table-data=auth.sessions \
              --exclude-table-data=auth.one_time_tokens --exclude-table-data=auth.mfa_amr_claims \
              --exclude-table-data=auth.flow_state' \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 -o "out/$name.dump.gpg" 3<<<"$BACKUP_PASSPHRASE"
          size=$(stat -c %s "out/$name.dump.gpg")
          echo "Backup: $name.dump.gpg ($size bytes)"
          # An empty or tiny file means the dump didn't really work.
          [ "$size" -gt 1000 ] || { echo "::error::El backup quedó demasiado chico ($size bytes)."; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dump.outputs.name }}
          path: out/*.dump.gpg
          retention-days: 90
          if-no-files-found: error

      # Supabase Free: 500 MB of database for the whole org (prod + staging); past that, the app stops
      # working. Fails well before (GitHub emails). It goes after the upload and also runs if the dump
      # failed, so neither one hides the other. What to do when it fires: DEPLOY.md → "Monitoreo".
      - name: Check database size
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          ALERT_MB: 350
        run: |
          set -euo pipefail
          # Same image as the dump; the URL goes in as an env var, never as an argument.
          bytes=$(docker run --rm -e BACKUP_DATABASE_URL \
            postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f \
            sh -c 'psql "$BACKUP_DATABASE_URL" -X -tAc "SELECT pg_database_size(current_database())"')
          [[ "$bytes" =~ ^[0-9]+$ ]] || { echo "::error::No se pudo leer el tamaño de la base."; exit 1; }
          mb=$((bytes / 1024 / 1024))
          echo "Tamaño de la base de prod: $mb MB (aviso a partir de $ALERT_MB MB)"
          if [ "$bytes" -gt $((ALERT_MB * 1024 * 1024)) ]; then
            echo "::error::La base de prod ocupa $mb MB y pasó el aviso de $ALERT_MB MB (Supabase Free: 500 MB sumando prod y staging; después la app deja de andar). Ver qué crece y decidir: DEPLOY.md → Monitoreo. El backup no depende de este aviso."
            exit 1
          fi
