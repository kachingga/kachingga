name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # Lo mismo que el pre-commit de husky (formato + typecheck + tests + lint)
      - run: bun run check

  migrations:
    name: Migraciones al día con el schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # Aplica todas las migraciones en un Postgres vacío y falla si el schema de Prisma
      # tiene cambios sin migración (falta correr `bun run db:migrate:new`).
      - name: Aplicar migraciones
        working-directory: apps/api
        run: bunx prisma migrate deploy
      - name: Schema sin cambios pendientes
        working-directory: apps/api
        run: |
          bunx prisma migrate diff --from-config-datasource --to-schema src/db --exit-code || {
            echo "::error::El schema de Prisma tiene cambios sin migración. Corré 'bun run db:migrate:new <nombre>' en apps/api."
            exit 1
          }
      # Supabase exposes `public` through its REST API with the public key: a table without RLS
      # would be readable by anyone (docs/claude/api/seguridad.md → "RLS").
      - name: Todas las tablas con RLS
        run: |
          tables=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p') AND NOT c.relrowsecurity
            ORDER BY 1")
          if [ -n "$tables" ]; then
            while IFS= read -r t; do
              echo "::error::La tabla \"$t\" no tiene RLS. Agregá 'ALTER TABLE \"$t\" ENABLE ROW LEVEL SECURITY;' en una migración (db:migrate:new lo agrega solo para las tablas nuevas)."
            done <<< "$tables"
            exit 1
          fi
          echo "Todas las tablas de public tienen RLS."

  commits:
    name: Formato de commits y título del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Reusa el mismo validador que el hook commit-msg de husky
      - name: Título del PR (es el mensaje del squash merge)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" > /tmp/title && sh .husky/commit-msg /tmp/title
      - name: Commits del PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%s "$sha" > /tmp/msg
            sh .husky/commit-msg /tmp/msg || status=1
          done
          exit $status
