# Promote to production: moves the `production` branch to the current `main` (fast-forward only).
# Railway deploys the `production` environment from that branch. Before running it: apply new
# migrations to prod (`bun run --cwd apps/api db:migrate:prod`) and try the change in staging.
name: Promover a producción

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Fast-forward de production a main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Mover production a main
        run: |
          if git ls-remote --exit-code --heads origin production >/dev/null; then
            git fetch origin production
            if ! git merge-base --is-ancestor origin/production origin/main; then
              echo "::error::production tiene commits que no están en main: no es un fast-forward."
              exit 1
            fi
          fi
          echo "production → $(git log -1 --format='%h %s' origin/main)"
          git push origin origin/main:refs/heads/production
